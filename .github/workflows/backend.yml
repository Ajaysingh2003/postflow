name: Backend checks

on:
  pull_request:
    paths: ["backend/**", ".github/workflows/backend.yml"]
  push:
    paths: ["backend/**", ".github/workflows/backend.yml"]

permissions:
  contents: read

jobs:
  sqlite:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.14"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e '.[dev]'
      - run: ruff check app tests migrations
      - run: pytest

  postgres-and-redis:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: postflow_test
          POSTGRES_USER: postflow_test
          POSTGRES_PASSWORD: test-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postflow_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      APP_ENV: test
      APP_SECRET: test-only-secret-that-is-long-enough-for-tests
      DATABASE_URL: postgresql+psycopg://postflow_test:test-only-password@localhost:5432/postflow_test
      POSTFLOW_TEST_DATABASE_URL: postgresql+psycopg://postflow_test:test-only-password@localhost:5432/postflow_test
      POSTFLOW_TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e '.[dev]'
      - run: alembic upgrade head
      - run: alembic check
      - run: pytest tests/test_backend_reliability.py
