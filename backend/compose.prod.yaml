# Requires Docker Compose 2.24.4+ (!override). Use scripts/compose-prod.sh.
name: draftva-prod

x-production-environment: &production_environment
  APP_ENV: production
  APP_SECRET: ${APP_SECRET:?Set a production APP_SECRET}
  DATABASE_URL: postgresql+psycopg://app:${POSTGRES_PASSWORD:?Set a production POSTGRES_PASSWORD}@postgres:5432/draftva
  REDIS_URL: redis://redis:6379/0

x-production-logging: &production_logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  migrate:
    env_file: !override
      - path: ${DRAFTVA_ENV_FILE:-./.env}
        required: true
    environment: *production_environment
    logging: *production_logging

  api:
    env_file: !override
      - path: ${DRAFTVA_ENV_FILE:-./.env}
        required: true
    environment:
      <<: *production_environment
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
      # Only this Nginx container may supply forwarded client IP/scheme headers.
      FORWARDED_ALLOW_IPS: ${NGINX_PROXY_IP:-172.29.250.2}
    ports: !reset []
    volumes: !reset []
    tmpfs: !override
      - /tmp:size=256m,mode=1777
    networks:
      - default
      - proxy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=5)"]
    logging: *production_logging
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

  worker:
    env_file: !override
      - path: ${DRAFTVA_ENV_FILE:-./.env}
        required: true
    environment: *production_environment
    volumes: !reset []
    logging: *production_logging
    deploy:
      resources:
        limits:
          memory: 768M
        reservations:
          memory: 192M

  scheduler:
    env_file: !override
      - path: ${DRAFTVA_ENV_FILE:-./.env}
        required: true
    environment: *production_environment
    volumes: !reset []
    logging: *production_logging
    deploy:
      resources:
        limits:
          memory: 384M
        reservations:
          memory: 128M

  postgres:
    ports: !reset []
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a production POSTGRES_PASSWORD}
    logging: *production_logging
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

  redis:
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory", "192mb", "--maxmemory-policy", "noeviction"]
    logging: *production_logging
    deploy:
      resources:
        limits:
          memory: 384M
        reservations:
          memory: 64M

  nginx:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/${NGINX_CONFIG:-https}.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/nginx/proxy.conf:/etc/nginx/draftva-proxy.conf:ro
      - tls_certificates:/etc/letsencrypt:ro
      - acme_challenges:/var/www/certbot:ro
    networks:
      proxy:
        ipv4_address: ${NGINX_PROXY_IP:-172.29.250.2}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/nginx-health"]
      interval: 30s
      timeout: 5s
      retries: 3
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=256m,mode=0755
      - /var/run:size=1m,mode=0755
    security_opt:
      - no-new-privileges:true
    logging: *production_logging
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          memory: 384M

  certbot:
    image: certbot/certbot:v5.8.0
    profiles: ["ops"]
    volumes:
      - tls_certificates:/etc/letsencrypt
      - acme_challenges:/var/www/certbot
    security_opt:
      - no-new-privileges:true
    logging: *production_logging

volumes:
  tls_certificates:
  acme_challenges:

networks:
  default:
    name: draftva-prod-internal
  proxy:
    name: draftva-prod-proxy
    ipam:
      config:
        - subnet: ${PROXY_NETWORK_SUBNET:-172.29.250.0/28}
          # Keep dynamic API addresses away from the reserved Nginx address.
          ip_range: ${PROXY_NETWORK_DYNAMIC_RANGE:-172.29.250.8/29}
