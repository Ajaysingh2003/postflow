[project]
name = "postflow-backend"
version = "0.1.0"
description = "FastAPI backend for postflow multi-channel publishing platform"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "alembic>=1.16,<2",
  "boto3>=1.40,<2",
  "sqlalchemy>=2.0,<3",
  "pydantic-settings>=2.10,<3",
  "email-validator>=2.2,<3",
  "argon2-cffi>=25,<26",
  "cryptography>=44,<47",
  "httpx>=0.28,<1",
  "google-auth>=2.40,<3",
  "redis>=6,<8",
  "python-multipart>=0.0.20,<1",
  "psycopg[binary]>=3.2,<4",
  "requests>=2.32,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
extend-ignore = ["B008", "FURB162"]
