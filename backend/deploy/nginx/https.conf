server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location = /nginx-health {
        access_log off;
        return 200 'ok';
    }
    location / { return 444; }
}

server {
    listen 80;
    listen [::]:80;
    server_name api.draftva.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 308 https://api.draftva.com$request_uri; }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
    return 444;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.draftva.com;

    ssl_certificate /etc/letsencrypt/live/api.draftva.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.draftva.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    add_header Strict-Transport-Security 'max-age=31536000' always;

    # R2 direct uploads are preferred; retain support for validated legacy uploads.
    location = /api/v1/media/attachments {
        client_max_body_size 110m;
        include /etc/nginx/draftva-proxy.conf;
    }
    location / {
        include /etc/nginx/draftva-proxy.conf;
    }
}
