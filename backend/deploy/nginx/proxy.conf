proxy_pass http://draftva_api;
proxy_http_version 1.1;
proxy_set_header Host api.draftva.com;
proxy_set_header Connection '';
proxy_set_header X-Forwarded-Host api.draftva.com;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Forwarded-Port 443;
# Replace client-supplied forwarding headers rather than appending spoofed IPs.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header Forwarded '';
proxy_set_header X-Request-ID $request_id;
proxy_connect_timeout 5s;
proxy_read_timeout 300s;
proxy_send_timeout 300s;
# Stream assistant/MCP events immediately; never cache authenticated API responses.
proxy_buffering off;
proxy_cache off;
# Retrying POSTs here could duplicate checkout or publishing operations.
proxy_next_upstream off;
