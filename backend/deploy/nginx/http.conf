# First-certificate bootstrap only: never forward credentials or API requests over HTTP.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location = /nginx-health {
        access_log off;
        return 200 'ok';
    }
    location / { return 444; }
}

server {
    listen 80;
    listen [::]:80;
    server_name api.draftva.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 503; }
}
