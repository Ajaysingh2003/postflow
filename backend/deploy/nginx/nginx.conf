user nginx;
worker_processes auto;
pid /var/run/nginx.pid;
# Ordinary upstream errors can echo sensitive query strings in Nginx error logs.
# Use access-log status codes/request IDs for request diagnostics instead.
error_log /dev/stderr crit;

events {
    worker_connections 2048;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;

    # Never log query strings: they can contain OAuth codes or reset tokens.
    log_format draftva '$remote_addr [$time_local] "$request_method $uri" '
                       '$status $body_bytes_sent $request_time request_id=$request_id';
    access_log /dev/stdout draftva;

    sendfile on;
    keepalive_timeout 65s;
    client_header_timeout 15s;
    client_body_timeout 60s;
    send_timeout 300s;
    client_max_body_size 2m;

    # Re-resolve Docker DNS when the API container is replaced during deployment.
    resolver 127.0.0.11 valid=10s ipv6=off;
    upstream draftva_api {
        zone draftva_api 64k;
        server api:8000 resolve;
        keepalive 32;
    }

    include /etc/nginx/conf.d/*.conf;
}
